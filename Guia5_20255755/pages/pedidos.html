<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="text-center mb-4">Gestión de pedidos de una cafetería</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="inputProducto" class="form-label">Producto</label>
                        <input type="text" id="inputProducto" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label for="inputPrecio" class="form-label">Precio unitario</label>
                        <input type="number" id="inputPrecio" class="form-control" step="0.01" min="0.01" required />
                    </div>
                    <div class="col-md-3">
                        <label for="inputCantidad" class="form-label">Cantidad</label>
                        <input type="number" id="inputCantidad" class="form-control" step="1" min="1" required />
                    </div>
                </div>
                <button type="button" id="btnAgregar" class="btn btn-primary mt-3">Agregar pedido</button>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label for="inputPrecioMaximo" class="form-label">Precio máximo</label>
                        <input type="number" id="inputPrecioMaximo" class="form-control" step="0.01" min="0.01" />
                    </div>
                    <div class="col-md-3">
                        <button type="button" id="btnFiltrar" class="btn btn-info w-100">Filtrar productos</button>
                    </div>
                    <div class="col-md-3">
                        <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary w-100">Mostrar todos</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="mensajes" class="d-none"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle bg-white">
                <thead class="table-success">
                    <tr>
                        <th>Producto</th>
                        <th>Precio unitario</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>

        <div class="row text-center g-3 mb-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Total de unidades</h5>
                        <p id="totalUnidades" class="fs-3 mb-0">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Monto total</h5>
                        <p id="montoTotal" class="fs-3 mb-0">$0.00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a href="../index.html" class="btn btn-secondary">Regresar</a>
            <button type="button" id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
        </div>
    </div>
</body>
</html>
